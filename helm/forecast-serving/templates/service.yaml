apiVersion: v1
kind: Service
metadata:
  name: {{ include "forecast-serving.fullname" . }}
  labels:
    {{- include "forecast-serving.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # A pod without a model is alive but not ready. It must still be reachable
  # through the Service: the retraining job POSTs /reload to it, and
  # bootstrap scripts wait on /live. Callers of /predict get a 503 they handle.
  publishNotReadyAddresses: true
  selector:
    {{- include "forecast-serving.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
