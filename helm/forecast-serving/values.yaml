# Default values for forecast-serving.
# Override with: helm install forecast-serving ./helm/forecast-serving -f my-values.yaml

replicaCount: 1

# Production: 3 replicas, minAvailable 2, required anti-affinity (see
# helm/predictive-stack/values-prod.yaml). The service is stateless: every
# replica follows the registry alias itself (model.refreshSeconds) and keeps
# a last-known-good copy of the model in an emptyDir.
podDisruptionBudget:
  enabled: false
  minAvailable: ""        # e.g. 2; empty = maxUnavailable
  maxUnavailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
priorityClassName: ""
terminationGracePeriodSeconds: 30
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment for the container (list of EnvVar), and Secrets/ConfigMaps
# to load whole (list of EnvFromSource), e.g. MLflow client credentials.
extraEnv: []
extraEnvFrom: []

# Set by the predictive-stack umbrella chart; standalone installs use image.tag.
# global.tls.enabled puts the API behind mutual TLS (see tls below).
global:
  imageTag: ""
  tls:
    enabled: false

# Mutual TLS on the API: uvicorn serves https on 8443 with the certificate in
# tls.secretName (cert-manager layout: tls.crt, tls.key, ca.crt) and requires a
# client certificate chained to ca.crt from every caller (the scaler, the
# training jobs, the ingress controller). /metrics is then served on a plain
# port (tls.metricsPort) for Prometheus, and the probes exec a python call with
# the pod's own certificate (the Certificate must carry client auth and the
# name localhost). Enabled by global.tls.enabled or tls.enabled.
tls:
  enabled: false
  secretName: forecast-serving-tls
  metricsPort: 9100

image:
  repository: ghcr.io/m0zart89/predictive-scaling-system/forecast-serving
  # Empty: use global.imageTag (set by the predictive-stack umbrella chart), else "latest".
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

# Extra pod annotations. The prometheus.io/scrape|port|path annotations are
# rendered by the template (the port moves to tls.metricsPort under mTLS).
podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: forecast.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: forecast-tls
  #   hosts:
  #     - forecast.local

# CPU/memory requests and limits.
# Inference is CPU-only; Random Forest on 10 features is sub-millisecond.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Scale on CPU since inference is CPU-bound
  targetCPUUtilizationPercentage: 70

# MLflow connection — stored in a Kubernetes Secret, not plain env vars
mlflow:
  trackingUri: "http://mlflow:5000"

model:
  name: "cpu-forecasting"
  # Registry alias moved by the retraining job (training/).
  alias: "champion"
  # Fallback while no alias exists yet (models registered by the notebook).
  stage: "Production"
  # Window size for legacy models only; newer models carry it in forecast_meta.json
  timeSteps: "10"
  # The lifecycle worker checks the registry alias this often and hot-swaps the
  # model when it moved; every replica does it, nothing is pushed ("0" = never).
  refreshSeconds: "60"
  # While no model is loaded, retry the registry this often.
  retrySeconds: "30"
  # The synchronous first fetch at startup gives up after this and the pod
  # starts without a model (alive, not ready) for the worker to fill.
  startupTimeoutSeconds: "20"
  # Threads for the CPU-bound inference, off the event loop.
  inferenceThreads: "4"

# Last-known-good model cache (emptyDir at /cache): a pod that restarts while
# MLflow is down serves the cached champion (model_stage "cache").
cache:
  sizeLimit: 256Mi

# forecast-serving's in-process scoring of its forecasts (forecast_rolling_mae).
# Exact with one replica only; with several, the scaler's own scoring
# (predictive_scaler_forecast_abs_error) is the source and this is set to "0".
quality:
  maxSeries: "64"

# Model download + unpickle can take a while on a cold registry; the startup
# probe keeps liveness from killing the pod meanwhile.
startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  periodSeconds: 5
  failureThreshold: 60

# /healthz — process is running (does not require model to be loaded)
# /readyz — model is loaded and inference is possible (200 with the version)
# This split prevents Kubernetes from restarting a healthy pod
# that is simply waiting for MLflow to become available.
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 6  # allow ~30s for model load before marking unready
