# Default values for forecast-serving.
# Override with: helm install forecast-serving ./helm/forecast-serving -f my-values.yaml

replicaCount: 1

# Production: 3 replicas, minAvailable 2, required anti-affinity (see
# helm/predictive-stack/values-prod.yaml). The service is stateless: every
# replica follows the registry alias itself (model.refreshSeconds) and keeps
# a last-known-good copy of the model in an emptyDir.
podDisruptionBudget:
  enabled: false
  minAvailable: ""        # e.g. 2; empty = maxUnavailable
  maxUnavailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
priorityClassName: ""
terminationGracePeriodSeconds: 30
topologySpreadConstraints: []
nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment for the container (list of EnvVar), and Secrets/ConfigMaps
# to load whole (list of EnvFromSource), e.g. MLflow client credentials.
extraEnv: []
extraEnvFrom: []

# Set by the predictive-stack umbrella chart; standalone installs use image.tag.
global:
  imageTag: ""

image:
  repository: ghcr.io/m0zart89/predictive-scaling-system/forecast-serving
  # Empty: use global.imageTag (set by the predictive-stack umbrella chart), else "latest".
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

# Prometheus auto-discovery annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: forecast.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: forecast-tls
  #   hosts:
  #     - forecast.local

# CPU/memory requests and limits.
# Inference is CPU-only; Random Forest on 10 features is sub-millisecond.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  # Scale on CPU since inference is CPU-bound
  targetCPUUtilizationPercentage: 70

# MLflow connection — stored in a Kubernetes Secret, not plain env vars
mlflow:
  trackingUri: "http://mlflow:5000"

# POST /reload requires this value in the X-Reload-Token header. Either set
# reloadToken (stored in this chart's Secret) or point reloadTokenSecret at an
# existing Secret (the predictive-stack umbrella generates one and shares it
# with the training jobs). Both empty: /reload is open — local runs only.
reloadToken: ""
reloadTokenSecret:
  name: ""
  key: RELOAD_TOKEN

model:
  name: "cpu-forecasting"
  # Registry alias moved by the retraining job (training/).
  alias: "champion"
  # Fallback while no alias exists yet (models registered by the notebook).
  stage: "Production"
  # Window size for legacy models only; newer models carry it in forecast_meta.json
  timeSteps: "10"
  # Check the alias this often and reload when it moved ("0" = only on /reload).
  refreshSeconds: "60"

# Last-known-good model cache (emptyDir at /cache): a pod that restarts while
# MLflow is down serves the cached champion (model_stage "cache").
cache:
  sizeLimit: 256Mi

# forecast-serving's in-process scoring of its forecasts (forecast_rolling_mae).
# Exact with one replica only; with several, the scaler's own scoring
# (predictive_scaler_forecast_abs_error) is the source and this is set to "0".
quality:
  maxSeries: "64"

# Model download + unpickle can take a while on a cold registry; the startup
# probe keeps liveness from killing the pod meanwhile.
startupProbe:
  httpGet:
    path: /live
    port: 8080
  periodSeconds: 5
  failureThreshold: 60

# /live — process is running (does not require model to be loaded)
# /ready — model is loaded and inference is possible
# This split prevents Kubernetes from restarting a healthy pod
# that is simply waiting for MLflow to become available.
livenessProbe:
  httpGet:
    path: /live
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 6  # allow ~30s for model load before marking unready
