apiVersion: v2
name: predictive-scaler
description: >
  KEDA external scaler that scales workloads on forecast demand.
  Reads recent demand from Prometheus, asks forecast-serving for the next
  interval and reports the result to KEDA as an external metric.
type: application
version: 0.2.0
appVersion: "0.2.0"
keywords:
  - keda
  - autoscaling
  - forecasting
  - ai-infrastructure
