apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "predictive-scaler.fullname" . }}
  labels:
    {{- include "predictive-scaler.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "predictive-scaler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "predictive-scaler.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "predictive-scaler.serviceAccountName" . }}
      # The scaler never talks to the Kubernetes API: KEDA calls it, it calls
      # Prometheus and forecast-serving over HTTP.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 6000
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: GRPC_PORT
              value: "6000"
            - name: METRICS_PORT
              value: "9100"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: STREAM_INTERVAL_SECONDS
              value: {{ .Values.streamIntervalSeconds | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
