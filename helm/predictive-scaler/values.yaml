# Default values for predictive-scaler.
#
# The scaler is stateless: everything workload-specific (PromQL query, target,
# forecast URL) lives in each ScaledObject's trigger metadata, so one
# deployment serves any number of ScaledObjects. See helm/predictive-stack/templates/demo.yaml.

replicaCount: 1

# Production: 2 replicas, maxUnavailable 1, required anti-affinity (see
# helm/predictive-stack/values-prod.yaml). Replicas share nothing: the
# decision cache is per pod and bounded by cacheSeconds, and each replica
# scores the forecasts it made from the history it fetches.
podDisruptionBudget:
  enabled: false
  minAvailable: ""
  maxUnavailable: 1
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
priorityClassName: ""
# Finish in-flight GetMetrics calls before SIGKILL.
terminationGracePeriodSeconds: 20
topologySpreadConstraints: []

# Set by the predictive-stack umbrella chart; standalone installs use image.tag.
# global.tls.enabled: mutual TLS on the gRPC port and towards forecast-serving.
global:
  imageTag: ""
  tls:
    enabled: false

# Mutual TLS: the gRPC server presents tls.secretName's certificate and
# requires one from KEDA (TriggerAuthentication with caCert/tlsClientCert/
# tlsClientKey, trigger metadata enableTLS); the same directory holds the
# client certificate the scaler shows forecast-serving (https URLs only;
# Prometheus stays plain HTTP). Enabled by global.tls.enabled or tls.enabled.
tls:
  enabled: false
  secretName: predictive-scaler-tls

image:
  repository: ghcr.io/m0zart89/predictive-scaling-system/predictive-scaler
  # Empty: use global.imageTag (set by the predictive-stack umbrella chart), else "latest".
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9100"
  prometheus.io/path: "/metrics"

service:
  type: ClusterIP
  grpcPort: 6000      # KEDA dials <service>.<namespace>:6000 (scalerAddress)
  metricsPort: 9100

logLevel: INFO

# Interval between pushes for `external-push` triggers (StreamIsActive).
streamIntervalSeconds: 15

# Pure Python with small HTTP calls; a decision every few seconds per
# ScaledObject costs next to nothing.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Native gRPC probes (Kubernetes >= 1.24) against the standard health service.
livenessProbe:
  grpc:
    port: 6000
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  grpc:
    port: 6000
    service: externalscaler.ExternalScaler
  initialDelaySeconds: 2
  periodSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
