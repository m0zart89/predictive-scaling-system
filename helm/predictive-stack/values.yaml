# predictive-stack: the whole system in one release.
#
#   helm dependency build helm/predictive-stack
#   helm upgrade --install predictive helm/predictive-stack -n predictive --create-namespace
#
# scripts/up.sh does this on a kind cluster, trains a model and runs smoke
# tests. Everything lives in the release namespace; Prometheus discovers pods
# there only (namespace-scoped RBAC).

global:
  # Tag for the four project images (forecast-serving, predictive-scaler,
  # cpu-burner, forecast-training). CI publishes <sha> and latest to GHCR.
  imageTag: latest

# ── subcharts ──────────────────────────────────────────────────────────────────

forecast-serving:
  enabled: true
  fullnameOverride: forecast-serving
  mlflow:
    trackingUri: http://mlflow:5000
  reloadTokenSecret:
    name: forecast-reload-token   # generated by the umbrella (security.reloadToken)
    key: RELOAD_TOKEN

predictive-scaler:
  enabled: true
  fullnameOverride: predictive-scaler

keda:
  enabled: true
  # KEDA's own charts default to 1 CPU limits per component; kind and CI
  # runners are small.
  resources:
    operator:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    metricServer:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}
    webhooks:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}

# ── platform components (templates/) ──────────────────────────────────────────

mlflow:
  enabled: true
  image: ghcr.io/mlflow/mlflow:v2.11.1
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""        # "" = the cluster default (kind: local-path)
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

prometheus:
  enabled: true
  image: prom/prometheus:v2.51.0
  scrapeInterval: 15s
  evaluationInterval: 30s
  # The retraining CronJob reads up to training.cronjob.days of history from
  # here, and the time-of-day features need whole days of it: keep it on a
  # volume and keep it long enough.
  retention: 30d
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""        # "" = the cluster default (kind: local-path)
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

grafana:
  enabled: true
  image: grafana/grafana:10.4.2
  adminPassword: admin
  anonymous: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

# One Ingress with a host per component: <name>.<domain>. With the kind
# config in scripts/kind-config.yaml and ingress-nginx, *.localhost resolves
# to the cluster from the host machine.
ingress:
  enabled: true
  className: nginx
  domain: localhost
  annotations: {}
  hosts:
    grafana: grafana
    prometheus: prometheus
    mlflow: mlflow
    forecast: forecast

# ── security ───────────────────────────────────────────────────────────────────

security:
  # X-Reload-Token for forecast-serving's POST /reload; "" = generated once at
  # install and kept (Secret forecast-reload-token). The training jobs read it.
  reloadToken: ""
  networkPolicy:
    # Restrict who can reach forecast-serving (scaler, training jobs,
    # Prometheus, the ingress controller). Needs a CNI that enforces
    # NetworkPolicy; off by default because kind's kindnet does not.
    enabled: false
    ingressNamespace: ingress-nginx

# ── workloads scaled by the predictive scaler ──────────────────────────────────

# Defaults for every ScaledObject the chart renders (workloads below and the
# demo). Any key can be overridden per workload.
scalerDefaults:
  minReplicas: 1
  maxReplicas: 10
  # model input = demand / capacity. The model is trained on the same series
  # (see training.workload), so this only needs to keep the numbers in a
  # sensible range; 1 is fine when the query is already in cores.
  capacity: "1"
  timeSteps: "10"
  # Samples fetched and sent per forecast. "" = timeSteps + one seasonal cycle
  # (training.cronjob.periodSeconds / stepSeconds): what the seasonal
  # candidates need. Set it to timeSteps to send the window alone.
  historySteps: ""
  stepSeconds: "300"      # must equal training.cronjob.stepSeconds
  mode: max               # max: never below observed demand; forecast: trust the model
  forecastAggregation: max
  activationValue: "0"
  cacheSeconds: "15"
  timeoutSeconds: "3"
  pollingInterval: 15
  cooldownPeriod: 300
  scaleDownStabilizationSeconds: 300
  fallback:
    failureThreshold: 3
    replicas: 4

# Your services. One ScaledObject per entry; the model is trained on the
# entry named by training.workload (default: the first). Example:
#
# workloads:
#   - name: api                       # ScaledObject name
#     deployment: api                 # Deployment in this namespace
#     query: sum(rate(container_cpu_usage_seconds_total{container="api"}[2m]))
#     targetValue: "0.7"              # demand one replica should carry (query units)
#     maxReplicas: 20
#     capacity: "4"
workloads: []

# ── demo workload ──────────────────────────────────────────────────────────────

demo:
  enabled: true
  # Total demand of the workload in cores, independent of replica count. Used
  # by the ScaledObject (scaling) and the retraining CronJob (training data),
  # so the model is fed exactly the series it was trained on.
  query: sum(rate(process_cpu_seconds_total{app="cpu-burner"}[1m]))
  image:
    repository: ghcr.io/m0zart89/predictive-scaling-system/cpu-burner
    tag: ""               # "" = global.imageTag
    pullPolicy: IfNotPresent
  replicas: 1
  # One Python process saturates at ~1 core; 500m keeps the maths simple:
  # a replica at 70% of its request carries 0.35 cores (targetValue).
  resources:
    requests: {cpu: 500m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
  # none       just the Deployment (first install, before KEDA's CRDs exist)
  # predictive KEDA ScaledObject on the predictive scaler (needs KEDA installed)
  # hpa        plain autoscaling/v2 HPA on CPU (needs metrics-server) — the
  #            reactive baseline for the benchmark
  scaling: none
  minReplicas: 1
  maxReplicas: 10
  hpa:
    targetCPUUtilizationPercentage: 70
    scaleDownStabilizationSeconds: 300
  predictive:
    # Cores one replica should carry: 70% of its 500m request.
    targetValue: "0.35"
    # model input = demand / capacity; keeps 10 x 500m inside the training range
    capacity: "2.5"
    timeSteps: "10"
    stepSeconds: "300"    # "30" compresses time for demos and CI
    mode: max
    forecastAggregation: max
    cacheSeconds: "15"
    timeoutSeconds: "3"
    pollingInterval: 15
    cooldownPeriod: 300
    scaleDownStabilizationSeconds: 300
    fallback:
      failureThreshold: 3
      replicas: 4

# ── retraining ─────────────────────────────────────────────────────────────────

training:
  # Name of the entry in `workloads` whose series the model is trained on
  # ("" = the first entry, or the demo when there are none). One model per
  # release: other workloads are scaled on the same model and should share
  # the pattern and the capacity.
  workload: ""
  image:
    repository: ghcr.io/m0zart89/predictive-scaling-system/forecast-training
    tag: ""               # "" = global.imageTag
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: "2", memory: 1Gi}
  # Nightly: last N days of the demand query from Prometheus.
  cronjob:
    enabled: true
    schedule: "17 3 * * *"
    # "" = (query of training.workload) / its capacity, i.e. exactly the
    # series the scaler feeds the model. Set explicitly only together with a
    # matching capacity on the workloads.
    query: ""
    days: "14"
    stepSeconds: "300"
    # Seasonal cycle for the time-of-day features: a real day. The benchmark
    # compresses a day into DAY_SECONDS and sets this accordingly.
    periodSeconds: "86400"
    timeSteps: "10"
    horizon: "6"
    minImprovement: "0.02"
    # Selection cost: one unit of demand the forecast missed costs this many
    # idle units (1 = plain MAE). The hgb_q75 candidates estimate the quantile
    # that minimises it at 3.
    underWeight: "3"
    # What the winner must beat: persistence (last value), seasonal (the value
    # one periodSeconds earlier) or best of the two. Both are always logged.
    baseline: persistence
  # One-off Job that trains from a saved Prometheus export in a ConfigMap
  # (kubectl create configmap train-data --from-file=notebooks/data-jan-2022.json)
  # and reloads forecast-serving. scripts/up.sh enables it on a fresh cluster.
  bootstrap:
    enabled: false
    configMap: train-data
    file: data-jan-2022.json
    exclude: "2022-01-17T00:00:00Z/2022-01-17T08:00:00Z"
    candidates: "hgb_delta"
    stepSeconds: "300"
    timeSteps: "10"
    horizon: "6"
