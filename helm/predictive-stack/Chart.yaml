apiVersion: v2
name: predictive-stack
description: >
  The whole predictive autoscaling system in one release: MLflow registry,
  Prometheus (namespace-scoped pod discovery), Grafana with the dashboards
  from monitoring/dashboards/, forecast-serving, the KEDA external scaler,
  KEDA itself, the nightly retraining CronJob, and optionally the cpu-burner
  demo workload with its ScaledObject or a plain CPU HPA.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - keda
  - autoscaling
  - forecasting
  - mlops
maintainers:
  - name: Mozart89
dependencies:
  - name: keda
    version: "2.21.0"
    repository: https://kedacore.github.io/charts
    condition: keda.enabled
  - name: forecast-serving
    version: "0.2.0"
    repository: file://../forecast-serving
    condition: forecast-serving.enabled
  - name: predictive-scaler
    version: "0.2.0"
    repository: file://../predictive-scaler
    condition: predictive-scaler.enabled
