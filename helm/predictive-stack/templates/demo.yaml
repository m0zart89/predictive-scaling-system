{{- if .Values.demo.enabled }}
{{- $demo := .Values.demo }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  labels:
    app: cpu-burner
    {{- include "predictive-stack.labels" . | nindent 4 }}
spec:
  {{- if eq $demo.scaling "none" }}
  replicas: {{ $demo.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cpu-burner
          image: {{ include "predictive-stack.image" (dict "image" $demo.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ $demo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml $demo.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-burner
  labels:
    app: cpu-burner
    {{- include "predictive-stack.labels" . | nindent 4 }}
spec:
  selector:
    app: cpu-burner
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if eq $demo.scaling "predictive" }}
---
{{- $w := dict "name" "cpu-burner" "deployment" "cpu-burner" "query" $demo.query
      "targetValue" $demo.predictive.targetValue "capacity" $demo.predictive.capacity
      "minReplicas" $demo.minReplicas "maxReplicas" $demo.maxReplicas
      "timeSteps" $demo.predictive.timeSteps "stepSeconds" $demo.predictive.stepSeconds
      "mode" $demo.predictive.mode "forecastAggregation" $demo.predictive.forecastAggregation
      "cacheSeconds" $demo.predictive.cacheSeconds "timeoutSeconds" $demo.predictive.timeoutSeconds
      "pollingInterval" $demo.predictive.pollingInterval "cooldownPeriod" $demo.predictive.cooldownPeriod
      "scaleDownStabilizationSeconds" $demo.predictive.scaleDownStabilizationSeconds
      "fallback" $demo.predictive.fallback }}
{{ include "predictive-stack.scaledobject" (dict "root" . "w" $w) }}
{{- else if eq $demo.scaling "hpa" }}
---
# Reactive baseline: a plain CPU HPA (needs metrics-server in the cluster).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-burner
  labels:
    {{- include "predictive-stack.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-burner
  minReplicas: {{ $demo.minReplicas }}
  maxReplicas: {{ $demo.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $demo.hpa.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: {{ $demo.hpa.scaleDownStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
{{- else if ne $demo.scaling "none" }}
{{- fail (printf "demo.scaling must be none, predictive or hpa, got %q" $demo.scaling) }}
{{- end }}
{{- end }}
