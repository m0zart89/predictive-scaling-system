{{- $t := .Values.training }}
{{- $image := include "predictive-stack.image" (dict "image" $t.image "global" .Values.global) }}
{{- $tw := include "predictive-stack.trainingWorkload" . | fromYaml }}
{{- $query := $t.cronjob.query }}
{{- if and (not $query) $tw.query }}
{{- $query = printf "(%s) / %s" (include "predictive-stack.demandQuery" (dict "root" . "name" $tw.name "query" $tw.query)) $tw.capacity }}
{{- end }}
{{- /* No query and no workload (a pilot before its workloads are added): no
       CronJob rather than one that would fail every night. NOTES.txt says so. */}}
{{- if and $t.cronjob.enabled $query }}
# Nightly retraining: pull the last N days from Prometheus, train candidates,
# compare with the @champion model on data it has not seen, move the alias if
# the new model is better, then tell forecast-serving to reload.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecast-retrain
  labels:
    app: forecast-retrain
    {{- include "predictive-stack.labels" . | nindent 4 }}
spec:
  schedule: {{ $t.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: forecast-retrain
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: train
              image: {{ $image | quote }}
              imagePullPolicy: {{ $t.image.pullPolicy }}
              env:
                - name: MLFLOW_TRACKING_URI
                  value: http://mlflow:5000
                - name: TRAIN_PROMETHEUS_URL
                  value: {{ include "predictive-stack.trainingPrometheusUrl" . | quote }}
                # Model units: the scaler feeds the model demand / capacity, so the
                # model is trained on exactly that series of training.workload.
                - name: TRAIN_QUERY
                  value: {{ $query | quote }}
                - name: TRAIN_DAYS
                  value: {{ $t.cronjob.days | quote }}
                - name: TRAIN_STEP_SECONDS
                  value: {{ $t.cronjob.stepSeconds | quote }}
                - name: TRAIN_PERIOD_SECONDS
                  value: {{ $t.cronjob.periodSeconds | quote }}
                - name: TRAIN_TIME_STEPS
                  value: {{ $t.cronjob.timeSteps | quote }}
                - name: TRAIN_HORIZON
                  value: {{ $t.cronjob.horizon | quote }}
                - name: TRAIN_MIN_IMPROVEMENT
                  value: {{ $t.cronjob.minImprovement | quote }}
                - name: TRAIN_UNDER_WEIGHT
                  value: {{ $t.cronjob.underWeight | quote }}
                - name: TRAIN_BASELINE
                  value: {{ $t.cronjob.baseline | quote }}
                - name: MODEL_NAME
                  value: cpu-forecasting
                - name: MODEL_ALIAS
                  value: champion
                - name: SERVING_RELOAD_URL
                  value: {{ if .Values.global.tls.enabled }}https{{ else }}http{{ end }}://forecast-serving:8080
                - name: SERVING_RELOAD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: forecast-reload-token
                      key: RELOAD_TOKEN
                {{- if .Values.global.tls.enabled }}
                - name: SERVING_TLS_DIR
                  value: /etc/serving-tls
                {{- end }}
              {{- with .Values.mlflow.client.existingSecret }}
              envFrom:
                - secretRef:
                    name: {{ . }}       # MLFLOW_TRACKING_USERNAME / _PASSWORD
              {{- end }}
              resources:
                {{- toYaml $t.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              {{- if .Values.global.tls.enabled }}
              volumeMounts:
                - name: serving-tls
                  mountPath: /etc/serving-tls
                  readOnly: true
          volumes:
            - name: serving-tls
              secret:
                secretName: forecast-training-client
              {{- end }}
{{- end }}
{{- if $t.bootstrap.enabled }}
---
# One-off: train the first champion from a saved Prometheus export mounted
# from a ConfigMap, then reload forecast-serving. Named by release revision so
# `helm upgrade --set training.bootstrap.enabled=true` can run it again.
apiVersion: batch/v1
kind: Job
metadata:
  name: train-bootstrap-{{ .Release.Revision }}
  labels:
    app: train-bootstrap
    {{- include "predictive-stack.labels" . | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: train-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mlflow
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://mlflow:5000/health >/dev/null 2>&1; do echo waiting for mlflow; sleep 3; done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: train
          image: {{ $image | quote }}
          imagePullPolicy: {{ $t.image.pullPolicy }}
          args:
            - --export=/data/{{ $t.bootstrap.file }}
            {{- with $t.bootstrap.exclude }}
            - --exclude={{ . }}
            {{- end }}
            - --candidates={{ $t.bootstrap.candidates }}
            - --step-seconds={{ $t.bootstrap.stepSeconds }}
            - --time-steps={{ $t.bootstrap.timeSteps }}
            - --horizon={{ $t.bootstrap.horizon }}
            - --period-seconds={{ $t.cronjob.periodSeconds }}
            - --under-weight={{ $t.cronjob.underWeight }}
            - --reload-url={{ if .Values.global.tls.enabled }}https{{ else }}http{{ end }}://forecast-serving:8080
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_NAME
              value: cpu-forecasting
            - name: MODEL_ALIAS
              value: champion
            - name: SERVING_RELOAD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forecast-reload-token
                  key: RELOAD_TOKEN
            {{- if .Values.global.tls.enabled }}
            - name: SERVING_TLS_DIR
              value: /etc/serving-tls
            {{- end }}
          {{- with .Values.mlflow.client.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml $t.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            {{- if .Values.global.tls.enabled }}
            - name: serving-tls
              mountPath: /etc/serving-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          configMap:
            name: {{ $t.bootstrap.configMap }}
        {{- if .Values.global.tls.enabled }}
        - name: serving-tls
          secret:
            secretName: forecast-training-client
        {{- end }}
{{- end }}
