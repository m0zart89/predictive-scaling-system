# Nightly retraining: pull the last 14 days from Prometheus, train candidates,
# compare with the @champion model on data it has not seen, move the alias if
# the new model is better, then tell forecast-serving to reload.
#
# Build the image into the cluster first:
#   eval $(minikube docker-env) && docker build -t forecast-training:latest training/
# Run once by hand:
#   kubectl create job --from=cronjob/forecast-retrain retrain-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecast-retrain
  labels:
    app: forecast-retrain
spec:
  schedule: "17 3 * * *"          # 03:17 UTC daily, off the hour to avoid the :00 rush
  concurrencyPolicy: Forbid       # never two trainings writing the registry at once
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: forecast-retrain
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: train
              image: forecast-training:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow:5000"
                - name: TRAIN_PROMETHEUS_URL
                  value: "http://prometheus:9090"
                # One series of the demand to forecast, at TRAIN_STEP_SECONDS
                # resolution. Must be in the same units the scaler queries.
                - name: TRAIN_QUERY
                  value: 'sum(rate(process_cpu_seconds_total{app="cpu-burner"}[5m]))'
                - name: TRAIN_DAYS
                  value: "14"
                - name: TRAIN_STEP_SECONDS
                  value: "300"
                - name: TRAIN_TIME_STEPS
                  value: "10"
                - name: TRAIN_HORIZON
                  value: "6"            # 6 x 5 min = 30 min ahead
                - name: TRAIN_MIN_IMPROVEMENT
                  value: "0.02"         # replace the champion only for a 2%+ better RMSE
                - name: MODEL_NAME
                  value: "cpu-forecasting"
                - name: MODEL_ALIAS
                  value: "champion"
                - name: SERVING_RELOAD_URL
                  value: "http://forecast-serving:8080"
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
