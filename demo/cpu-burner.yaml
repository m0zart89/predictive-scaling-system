# Demo workload scaled by the predictive scaler (see scaledobject.yaml).
# Build the image into the cluster first: see demo/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: demo
  labels:
    app: cpu-burner
spec:
  replicas: 1   # managed by KEDA once the ScaledObject is applied
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: cpu-burner
          image: cpu-burner:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # One Python process saturates at ~1 core; 500m keeps the maths simple:
          # a replica at 70% of its request carries 0.35 cores (targetValue).
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-burner
  namespace: demo
spec:
  selector:
    app: cpu-burner
  ports:
    - name: http
      port: 8080
      targetPort: http
