          },
          "id": 9,
          "options": {},
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/predict\"}[5m])))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
