name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Lint serving/, scaler/, training/, demo/, monitoring/ and tests/
        run: ruff check serving/ scaler/ training/ demo/ monitoring/ tests/

  test-serving:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # tests/test_training_serving.py also imports training/ (same pins)
        run: pip install -r serving/requirements.txt -r training/requirements.txt pytest httpx pytest-timeout pyyaml

      - name: Run tests
        run: pytest tests/ -v --timeout=30
        env:
          # Fast-fail MLflow connection attempts during tests (no live MLflow server in CI)
          MLFLOW_HTTP_REQUEST_TIMEOUT: "3"
          MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
          MLFLOW_TRACKING_URI: "http://127.0.0.1:1"

  test-training:
    name: Training pipeline tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r training/requirements.txt pytest pytest-timeout

      # Uses a throwaway SQLite-backed MLflow registry; no server needed.
      - name: Run tests
        run: pytest training/tests/ -v --timeout=300

  test-scaler:
    name: Scaler tests
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scaler/requirements-dev.txt

      - name: Generated gRPC stubs are up to date
        run: |
          scaler/gen_proto.sh
          git diff --exit-code -- scaler/predictive_scaler/ \
            || (echo "::error::Stubs are stale: run scaler/gen_proto.sh and commit" && exit 1)

      - name: Run tests
        run: pytest scaler/tests/ -v --timeout=30

  build-image:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: lint-python
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # serving builds from the root: it copies training/forecast_training/features.py
          - name: forecast-serving
            context: .
            file: ./serving/Dockerfile
          - name: predictive-scaler
            context: ./scaler
            file: ./scaler/Dockerfile
          - name: cpu-burner
            context: ./demo/cpu-burner
            file: ./demo/cpu-burner/Dockerfile
          - name: forecast-training
            context: ./training
            file: ./training/Dockerfile
          # upstream MLflow + PostgreSQL driver + S3 client (production backends)
          - name: mlflow-server
            context: ./mlflow
            file: ./mlflow/Dockerfile
    env:
      # Images are published to GHCR under the repository:
      #   ghcr.io/<owner>/predictive-scaling-system/<name>:{<sha>,latest}
      # Pull requests only build (no credentials for forks); pushes to main push.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ env.PUSH == 'true' }}

      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache backend, one scope per image
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  monitoring:
    name: Dashboards and alert rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.1

      # Validates monitoring/dashboards/*.json and the alert rules (structure,
      # metric and label names against the code, a runbook per alert) and fails
      # if the copies in helm/predictive-stack/files/ were not re-synced.
      - name: Validate dashboards, rules and runbooks
        run: python monitoring/render.py --check

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.22.1"

      - name: Resolve umbrella chart dependencies (KEDA)
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm dependency build helm/predictive-stack

      - name: Lint Helm charts
        run: |
          helm lint helm/forecast-serving/ helm/predictive-scaler/
          helm lint helm/predictive-stack/ --set demo.scaling=predictive --set training.bootstrap.enabled=true
          helm lint helm/predictive-stack/ --set demo.scaling=hpa
          helm lint helm/predictive-stack/ -f helm/predictive-stack/values-pilot.yaml
          helm lint helm/forecast-serving/ --set reloadToken=secret-for-lint
          helm lint helm/predictive-stack/ -f helm/predictive-stack/ci/workloads-values.yaml

      - name: Helm template (dry-run)
        run: |
          set -x
          for chart in forecast-serving predictive-scaler; do
            helm template "$chart" "helm/$chart/" --set image.tag=ci-${{ github.sha }} --debug > /dev/null
          done
          helm template predictive helm/predictive-stack/ -n predictive \
            --set global.imageTag=ci-${{ github.sha }} --set demo.scaling=predictive \
            --set training.bootstrap.enabled=true > /tmp/stack.yaml
          # the umbrella chart must carry the same dashboards and rules as monitoring/
          grep -q 'forecast_rolling_mae' /tmp/stack.yaml
          grep -q 'alert: ForecastDriftHigh' /tmp/stack.yaml
          # anchored: KEDA's CRD mentions the kind too (indented)
          grep -q '^kind: ScaledObject$' /tmp/stack.yaml
          # the CronJob trains on what the scaler feeds the model: demand / capacity
          grep -Fq '[1m]))) / 2.5"' /tmp/stack.yaml
          # the scaler sends the window plus a day of 5-minute samples (10 + 288)
          grep -q 'historySteps: "298"' /tmp/stack.yaml
          grep -q 'TRAIN_UNDER_WEIGHT' /tmp/stack.yaml
          # workloads: one ScaledObject each, the model trained on training.workload
          helm template predictive helm/predictive-stack/ -n predictive \
            -f helm/predictive-stack/ci/workloads-values.yaml > /tmp/workloads.yaml
          test "$(grep -c '^kind: ScaledObject$' /tmp/workloads.yaml)" = 2
          grep -Fq 'container=\"worker\"}[2m]))) / 1"' /tmp/workloads.yaml
          grep -q 'stepSeconds: "60"' /tmp/workloads.yaml
          # history follows each workload's own step: 10 + 86400/60 for the worker
          grep -q 'historySteps: "1450"' /tmp/workloads.yaml
          grep -q 'historySteps: "298"' /tmp/workloads.yaml
          # an explicit historySteps wins over the computed one
          helm template predictive helm/predictive-stack/ -n predictive --set demo.scaling=predictive \
            --set scalerDefaults.historySteps=10 | grep -q 'historySteps: "10"'
          # the reload token reaches both the service and the training jobs
          test "$(grep -c 'name: forecast-reload-token' /tmp/stack.yaml)" -ge 4
          helm template predictive helm/predictive-stack/ -n predictive \
            -f helm/predictive-stack/values-pilot.yaml | grep -q 'kind: NetworkPolicy'
          # production profile: PDBs, anti-affinity, HA KEDA, read-only images
          helm template predictive helm/predictive-stack/ -n predictive \
            -f helm/predictive-stack/values-pilot.yaml -f helm/predictive-stack/values-prod.yaml > /tmp/prod.yaml
          test "$(grep -c '^kind: PodDisruptionBudget$' /tmp/prod.yaml)" -ge 2
          test "$(grep -c 'podAntiAffinity' /tmp/prod.yaml)" -ge 2
          grep -q 'minAvailable: 2' /tmp/prod.yaml
          grep -q 'MODEL_REFRESH_SECONDS' /tmp/prod.yaml
          grep -q 'startupProbe' /tmp/prod.yaml
          # MLflow on an external backend: DSN from a Secret, S3 artifacts, rolling
          # updates, the db-upgrade hook, and no PVC
          helm template predictive helm/predictive-stack/ -n predictive \
            -f helm/predictive-stack/values-pilot.yaml -f helm/predictive-stack/values-prod.yaml \
            --set mlflow.backendStore.existingSecret=mlflow-backend \
            --set mlflow.artifacts.destination=s3://bucket/mlflow --set mlflow.replicas=2 > /tmp/mlflow.yaml
          grep -q -- '--backend-store-uri=$(MLFLOW_BACKEND_STORE_URI)' /tmp/mlflow.yaml
          grep -q -- '--artifacts-destination=s3://bucket/mlflow' /tmp/mlflow.yaml
          grep -q 'name: mlflow-db-upgrade-' /tmp/mlflow.yaml
          grep -q 'helm.sh/hook: pre-install,pre-upgrade' /tmp/mlflow.yaml
          if grep -q 'claimName: mlflow' /tmp/mlflow.yaml; then
            echo "::error::MLflow still mounts a PVC with an external backend store"; exit 1
          fi
          # Prometheus modes: operator renders the CR, PodMonitors and a PrometheusRule
          # with the demand recording rule, no Deployment; external renders nothing
          # and points the scaler, Grafana and the training job at the URL
          grep -q '^kind: Prometheus$' /tmp/prod.yaml
          grep -q '^kind: PrometheusRule$' /tmp/prod.yaml
          grep -q 'alert: ForecastDriftHigh' /tmp/prod.yaml
          # the demand rule needs workloads: the PrometheusRule carries one per entry
          helm template predictive helm/predictive-stack/ -n predictive \
            -f helm/predictive-stack/values-pilot.yaml -f helm/predictive-stack/values-prod.yaml \
            -f helm/predictive-stack/ci/workloads-values.yaml | grep -c 'record: workload:demand' | grep -qx 2
          if grep -q 'name: prometheus-config' /tmp/prod.yaml; then
            echo "::error::the builtin Prometheus was rendered in operator mode"; exit 1
          fi
          helm template predictive helm/predictive-stack/ -n predictive --set demo.scaling=predictive \
            --set prometheus.mode=external --set prometheus.external.url=http://thanos-query.monitoring.svc:9090 \
            --set prometheus.recordDemand=true > /tmp/external.yaml
          grep -q 'prometheusServerAddress: http://thanos-query.monitoring.svc:9090' /tmp/external.yaml
          grep -q 'url: http://thanos-query.monitoring.svc:9090' /tmp/external.yaml
          grep -q 'value: "http://thanos-query.monitoring.svc:9090"' /tmp/external.yaml
          grep -Fq 'query: "workload:demand{workload=\"cpu-burner\"}"' /tmp/external.yaml
          grep -Fq '(workload:demand{workload=\"cpu-burner\"}) / 2.5' /tmp/external.yaml
          if grep -q '^kind: Prometheus$\|name: prometheus-config' /tmp/external.yaml; then
            echo "::error::a Prometheus was rendered in external mode"; exit 1
          fi
          # the builtin default still carries the demand rule next to the alert rules
          grep -q 'record: workload:demand' /tmp/stack.yaml
          # replicas > 1 on SQLite must be refused
          if helm template predictive helm/predictive-stack/ -n predictive --set mlflow.replicas=2 > /dev/null 2>&1; then
            echo "::error::mlflow.replicas=2 on SQLite rendered"; exit 1
          fi
          # mutual TLS: five Certificates, KEDA's TriggerAuthentication and enableTLS,
          # https towards serving, uvicorn with client-cert verification, the scaler's
          # TLS_DIR and plaintext health port, the forecast ingress with backend mTLS
          helm template predictive helm/predictive-stack/ -n predictive --set demo.scaling=predictive \
            --set global.tls.enabled=true --set global.tls.issuerRef.name=internal-ca > /tmp/tls.yaml
          test "$(grep -c '^kind: Certificate$' /tmp/tls.yaml)" = 5
          grep -q '^kind: TriggerAuthentication$' /tmp/tls.yaml
          grep -q 'enableTLS: "true"' /tmp/tls.yaml
          grep -q 'name: predictive-scaler-mtls' /tmp/tls.yaml
          grep -q 'forecastServiceURL: https://forecast-serving' /tmp/tls.yaml
          grep -q -- '--ssl-cert-reqs' /tmp/tls.yaml
          grep -q 'name: TLS_DIR' /tmp/tls.yaml
          grep -q 'name: HEALTH_PORT' /tmp/tls.yaml
          grep -q 'name: SERVING_TLS_DIR' /tmp/tls.yaml
          grep -q 'backend-protocol: "HTTPS"' /tmp/tls.yaml
          grep -q 'prometheus.io/port: "9100"' /tmp/tls.yaml
          if grep -q 'forecastServiceURL: http://' /tmp/tls.yaml; then
            echo "::error::a plaintext forecastServiceURL was rendered under TLS"; exit 1
          fi
          if helm template predictive helm/predictive-stack/ -n predictive --set global.tls.enabled=true > /dev/null 2>&1; then
            echo "::error::global.tls.enabled without an issuer rendered"; exit 1
          fi
          # alert-driven retraining: Alertmanager routes the two alerts to the trigger,
          # the trigger has the CronJob/Jobs RBAC and the shared token, Prometheus
          # knows the Alertmanager (builtin config and the operator CR)
          grep -q 'alertmanager:9093' /tmp/prod.yaml || grep -q 'name: alertmanager' /tmp/prod.yaml
          grep -q 'url: http://retrain-trigger:8080/alertmanager' /tmp/prod.yaml
          grep -q 'alertname =~ "ForecastDriftHigh|ForecastBreakerOpenLong"' /tmp/prod.yaml
          grep -q 'forecast_training.trigger' /tmp/prod.yaml
          grep -q 'resourceNames: \[forecast-retrain\]' /tmp/prod.yaml
          test "$(grep -c 'name: retrain-trigger-token' /tmp/prod.yaml)" -ge 3
          helm template predictive helm/predictive-stack/ -n predictive --set demo.scaling=predictive \
            --set alertmanager.enabled=true --set training.trigger.enabled=true | grep -q 'targets: \[alertmanager:9093\]'
          # default-deny ingress with the pilot profile
          helm template predictive helm/predictive-stack/ -n predictive -f helm/predictive-stack/values-pilot.yaml \
            -f helm/predictive-stack/ci/workloads-values.yaml > /tmp/pilot.yaml
          grep -q 'name: default-deny-ingress' /tmp/pilot.yaml
          test "$(grep -c '^kind: NetworkPolicy$' /tmp/pilot.yaml)" -ge 8
          # the default profile renders no PDB (single replicas) but the same probes
          if grep -q '^kind: PodDisruptionBudget$' /tmp/stack.yaml; then
            echo "::error::a PodDisruptionBudget was rendered for single-replica defaults"; exit 1
          fi
          # nothing to train on yet (pilot before its workloads are added): no CronJob,
          # no broken query — the release must still install so KEDA's CRDs land
          helm template predictive helm/predictive-stack/ -n predictive --set demo.enabled=false > /tmp/empty.yaml
          if grep -q '^kind: CronJob$' /tmp/empty.yaml; then
            echo "::error::a CronJob was rendered with nothing to train on"; exit 1
          fi

  # Placeholder job — shows the intended CD path without implementing it
  # In a real cluster, this would use ArgoCD image updater or a Helm upgrade action.
  deploy-check:
    name: Deployment readiness check
    runs-on: ubuntu-latest
    needs: [test-serving, test-training, test-scaler, build-image, helm-lint, monitoring]
    steps:
      - name: All checks passed
        run: echo "Image built and Helm chart validated. Ready for deployment."
